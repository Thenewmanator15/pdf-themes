# Puts the demo folder on GitHub Pages whenever it changes.
name: Demo

on:
  push:
    branches: [main]
    paths:
      - demo/**
      - .github/workflows/pages.yml
  workflow_dispatch:

# Read-only by default; only the deploy job below can publish to Pages.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false             # a deployment under way is allowed to finish

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write      # publishing the site
      id-token: write   # proving to Pages that the upload came from this run
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the site
        # demo/index.html has no doctype or head of its own, so the start of
        # the document is written here, with the Content Security Policy before
        # anything it governs. The other pages carry the same policy in their
        # own heads, so a change to it goes there too.
        env:
          CSP: "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; worker-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"
        run: |
          mkdir _site
          cp -r demo/. _site/
          {
            printf '%s\n' '<!doctype html>' '<html lang="en-GB">' '<meta charset="utf-8">' \
              "<meta http-equiv=\"Content-Security-Policy\" content=\"$CSP\">" \
              '<meta name="viewport" content="width=device-width, initial-scale=1">'
            cat demo/index.html
          } > _site/index.html
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

# Puts the demo folder on GitHub Pages whenever it changes.
name: Demo

on:
  push:
    branches: [main]
    paths:
      - demo/**
      - .github/workflows/pages.yml
  workflow_dispatch:

# Read-only by default; only the deploy job below can publish to Pages.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false             # a deployment under way is allowed to finish

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write      # publishing the site
      id-token: write   # proving to Pages that the upload came from this run
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the site
        # demo/index.html has no doctype or head of its own, so the start of
        # the document is written here.
        run: |
          mkdir _site
          cp -r demo/. _site/
          {
            printf '%s\n' '<!doctype html>' '<html lang="en">' '<meta charset="utf-8">' \
              '<meta name="viewport" content="width=device-width, initial-scale=1">' \
              '<style>body { margin: 0; }</style>'
            cat demo/index.html
          } > _site/index.html
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

# Puts the demo folder on GitHub Pages whenever it changes.
name: Demo

on:
  push:
    branches: [main]
    paths:
      - demo/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Build the site
        # demo/index.html has no doctype or head of its own, so the start of
        # the document is written here.
        run: |
          mkdir _site
          cp -r demo/. _site/
          {
            printf '%s\n' '<!doctype html>' '<html lang="en">' '<meta charset="utf-8">' \
              '<meta name="viewport" content="width=device-width, initial-scale=1">' \
              '<style>body { margin: 0; }</style>'
            cat demo/index.html
          } > _site/index.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5

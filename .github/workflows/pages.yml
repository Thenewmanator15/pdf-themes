# Puts the demo folder on GitHub Pages whenever it changes.
name: Demo

on:
  push:
    branches: [main]
    paths:
      - demo/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Build the site
        # demo/index.html has no doctype or head of its own, so the start of
        # the document is written here, with the Content Security Policy before
        # anything it governs. The other pages carry the same policy in their
        # own heads, so a change to it goes there too.
        env:
          CSP: "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; worker-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"
        run: |
          mkdir _site
          cp -r demo/. _site/
          {
            printf '%s\n' '<!doctype html>' '<html lang="en-GB">' '<meta charset="utf-8">' \
              "<meta http-equiv=\"Content-Security-Policy\" content=\"$CSP\">" \
              '<meta name="viewport" content="width=device-width, initial-scale=1">'
            cat demo/index.html
          } > _site/index.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
